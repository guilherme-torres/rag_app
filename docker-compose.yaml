services:
  app:
    build: .
    container_name: rag_app
    networks:
      - ollama-network
      - mongodb-network
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - mongo
  
  mongo:
    image: mongo:6-jammy
    container_name: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb_data:/data/db
    networks:
      - mongodb-network

  mongoexpress:
    image: mongo-express
    ports:
      - "8081:8081"
    networks:
      - mongodb-network
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongo:27017
    depends_on:
      - mongo

networks:
  mongodb-network:
    driver: bridge
  ollama-network:
    name: ollama_ollama-network
    external: true