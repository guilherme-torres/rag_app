services:
  app:
    build: .
    # entrypoint: "fastapi run src/main.py --port 8080"
    entrypoint: "tail -f /dev/null"
    container_name: rag_app
    networks:
      - ollama-network
      - mongodb-network
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
    depends_on:
      - mongo
  
  mongo:
    image: mongo:6-jammy
    container_name: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb_data:/data/db
    networks:
      - mongodb-network

  mongoexpress:
    image: mongo-express
    container_name: mongoexpress
    ports:
      - "8081:8081"
    networks:
      - mongodb-network
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongo:27017
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD}
    depends_on:
      - mongo

networks:
  mongodb-network:
    driver: bridge
  ollama-network:
    name: ollama_ollama-network
    external: true